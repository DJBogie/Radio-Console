<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Radio Console - Independent Broadcast</title>

    <style>

        body {

            background-color: #2b1d15;

            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('photo/background.png');

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            color: #e0d0c0;

            font-family: 'Courier New', Courier, monospace;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

            margin: 0;

            overflow-x: hidden;

            user-select: none;

        }



        .console-cabinet {

            background: linear-gradient(135deg, rgba(43, 29, 21, 0.92), rgba(24, 16, 12, 0.92));

            border: 12px solid #080504;

            padding: 30px 40px;

            border-radius: 12px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 2px 8px rgba(255,255,255,0.05);

            width: 780px;

            text-align: center;

            backdrop-filter: blur(2px);

        }



        .brand-plate {

            font-size: 14px;

            letter-spacing: 4px;

            color: #8c7355;

            margin-bottom: 15px;

            text-transform: uppercase;

        }



        .radio-faceplate {

            background: #111;

            border: 4px solid #222;

            border-radius: 8px;

            padding: 20px 25px;

            position: relative;

            box-shadow: inset 0 5px 15px rgba(0,0,0,0.9);

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;

        }



        .knob-assembly {

            display: flex;

            flex-direction: column;

            align-items: center;

            width: 90px;

        }



        .knob {

            width: 75px;

            height: 75px;

            border-radius: 50%;

            background: radial-gradient(circle, #e0e0e0 30%, #888 65%, #333 100%);

            border: 4px solid #111;

            box-shadow: 0 8px 16px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.8);

            position: relative;

            transform: rotate(-45deg);

        }



        .knob::after {

            content: '';

            position: absolute;

            top: 6px;

            left: 50%;

            transform: translateX(-50%);

            width: 4px;

            height: 20px;

            background: #222;

            border-radius: 2px;

        }



        .knob-label {

            font-size: 11px;

            color: #aaa;

            letter-spacing: 2px;

            margin-top: 8px;

            font-weight: bold;

        }



        .dial-window {

            flex-grow: 1;

            background: #000;

            border: 3px solid #2c2c2c;

            border-radius: 4px;

            padding: 12px 15px;

            position: relative;

            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);

            text-align: left;

        }



        .scale-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            font-size: 11px;

            color: #ccc;

            margin-bottom: 6px;

            letter-spacing: 0.5px;

        }



        .band-label {

            color: #ff3333;

            font-weight: bold;

            width: 35px;

        }



        .scale-numbers {

            display: flex;

            justify-content: space-between;

            flex-grow: 1;

            padding: 0 5px;

            overflow: hidden;

        }



        .scale-numbers span {

            font-size: 9px;

            white-space: nowrap;

        }



        .scale-unit {

            color: #ff3333;

            font-weight: bold;

            font-size: 11px;

            width: 35px;

            text-align: right;

        }



        .tuning-track-container {

            position: relative;

            height: 16px;

            background: #181818;

            border-radius: 3px;

            margin: 6px 35px 8px 35px;

            border: 1px solid #333;

        }



        .tuning-indicator-bar {

            position: absolute;

            top: 2px;

            bottom: 2px;

            width: 12px;

            background: #e6e6e6;

            border-radius: 2px;

            box-shadow: 0 0 8px rgba(255,255,255,0.8);

            transform: translateX(-50%);

            transition: left 0.05s ease-out;

        }



        .sub-footer-text {

            text-align: center;

            font-size: 11px;

            color: #888;

            letter-spacing: 2px;

            border-top: 1px solid #222;

            padding-top: 6px;

            margin-top: 4px;

        }



        .screen-display {

            background: rgba(8, 12, 8, 0.9);

            border: 2px solid #1a261a;

            padding: 15px;

            border-radius: 4px;

            font-size: 15px;

            color: #4cd137;

            min-height: 32px;

            margin-bottom: 20px;

            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);

            letter-spacing: 1px;

            text-shadow: 0 0 6px rgba(76, 209, 55, 0.4);

        }



        .controls-panel {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }



        input[type=range] {

            width: 100%;

            accent-color: #8c7355;

            cursor: pointer;

            height: 8px;

            background: #111;

            border-radius: 4px;

        }



        .helper-text {

            font-size: 11px;

            color: #888;

            text-transform: uppercase;

            letter-spacing: 2px;

        }



        /* MAGNIFIED DENSE OSCILLOSCOPE WITH DRIFTING PARTICLES BACKGROUND */

        .visualizer {

            height: 240px;

            margin: 0 0 20px 0;

            padding: 8px;

            background: #000000;

            border: 2px solid #1c182b;

            border-radius: 4px;

            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);

            position: relative;

            overflow: hidden;

        }



        #visualizerCanvas {

            display: block;

            width: 100%;

            height: 100%;

            position: relative;

            z-index: 2;

        }

    </style>

</head>

<body>



    <div class="console-cabinet">

        <div class="brand-plate">DJBogie Radio Console High Fidelity Receiver</div>

        

        <div class="radio-faceplate">

            <div class="knob-assembly">

                <div class="knob"></div>

                <div class="knob-label">VOLUME</div>

            </div>



            <div class="dial-window">

                <div class="scale-row">

                    <span class="band-label">FM</span>

                    <div class="scale-numbers">

                        <span>88</span><span>90</span><span>92</span><span>94</span><span>96</span><span>98</span><span>100</span><span>102</span><span>105</span><span>108</span>

                    </div>

                    <span class="scale-unit">MHz</span>

                </div>



                <div class="tuning-track-container">

                    <div id="tuningBar" class="tuning-indicator-bar" style="left: 0%;"></div>

                </div>



                <div class="scale-row">

                    <span class="band-label" style="color: #ffaa33;">AM</span>

                    <div class="scale-numbers" style="color: #aaa;">

                        <span>535</span><span>650</span><span>800</span><span>1000</span><span>1200</span><span>1400</span><span>1500</span><span>1605</span>

                    </div>

                    <span class="scale-unit" style="color: #ffaa33;">kHz</span>

                </div>



                <div class="sub-footer-text">FM/AM BAND RADIO CONSOLE</div>

            </div>



            <div class="knob-assembly">

                <div class="knob" style="transform: rotate(45deg);"></div>

                <div class="knob-label">TUNING</div>

            </div>

        </div>

        

        <div class="screen-display" id="stationDisplay">

            RECEIVER STATUS: STANDBY... SWEEP DIAL TO SCAN FREQUENCIES

        </div>



        <div class="visualizer">

            <canvas id="visualizerCanvas"></canvas>

        </div>



        <div class="controls-panel">

            <input type="range" id="tuner" min="87.0" max="108.0" step="0.1" value="87.0">

            <div class="helper-text">Frequency Slide Tuner</div>

        </div>

    </div>



    <!-- Single Audio Element -->

    <audio id="mainAudio" preload="auto" loop></audio>



    <script>

        const tuner = document.getElementById('tuner');

        const tuningBar = document.getElementById('tuningBar');

        const stationDisplay = document.getElementById('stationDisplay');

        const audioEl = document.getElementById('mainAudio');



        // ==========================================

        // DENSE OSCILLOSCOPE + DRIFTING PARTICLES ENGINE

        // ==========================================

        const canvas = document.getElementById('visualizerCanvas');

        const canvasCtx = canvas.getContext('2d');



        let audioContext = null;

        let analyser = null;

        let sourceNode = null;

        let visualizerStarted = false;



        // Background motion particle state

        let particles = [];

        const numParticles = 40;



        function initParticles(width, height) {

            particles = [];

            for (let i = 0; i < numParticles; i++) {

                particles.push({

                    x: Math.random() * width,

                    y: Math.random() * height,

                    size: Math.random() * 2 + 0.5,

                    speed: Math.random() * 0.8 + 0.2,

                    opacity: Math.random() * 0.3 + 0.05

                });

            }

        }



        function resizeVisualizer() {

            const rect = canvas.getBoundingClientRect();

            const dpr = window.devicePixelRatio || 1;



            canvas.width = Math.max(1, Math.floor(rect.width * dpr));

            canvas.height = Math.max(1, Math.floor(rect.height * dpr));



            canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            initParticles(rect.width, rect.height);

        }



        function setupVisualizer() {

            if (visualizerStarted) return;



            audioContext = new (window.AudioContext || window.webkitAudioContext)();

            analyser = audioContext.createAnalyser();



            analyser.fftSize = 2048; 

            analyser.smoothingTimeConstant = 0.3;



            sourceNode = audioContext.createMediaElementSource(audioEl);

            sourceNode.connect(analyser);

            analyser.connect(audioContext.destination);



            visualizerStarted = true;

            resizeVisualizer();

            drawVisualizer();

        }



        function drawVisualizer() {

            requestAnimationFrame(drawVisualizer);



            const rect = canvas.getBoundingClientRect();

            const width = rect.width;

            const height = rect.height;



            // Clear background

            canvasCtx.fillStyle = '#000000';

            canvasCtx.fillRect(0, 0, width, height);



            // 1. DRAW MOVING BACKGROUND PARTICLES ONLY (Sweeping bar removed)

            canvasCtx.save();

            particles.forEach(p => {

                p.x -= p.speed; // Move left to simulate feed motion

                if (p.x < 0) p.x = width; // Wrap around



                canvasCtx.fillStyle = `rgba(100, 150, 255, ${p.opacity})`;

                canvasCtx.fillRect(p.x, p.y, p.size * 2, p.size);

            });

            canvasCtx.restore();



            // 2. DRAW MAGNIFIED OSCILLOSCOPE WAVEFORM

            const bufferLength = analyser ? analyser.frequencyBinCount : 1024;

            const dataArray = new Uint8Array(bufferLength);



            if (analyser && !audioEl.paused) {

                analyser.getByteTimeDomainData(dataArray);

            } else {

                dataArray.fill(128);

            }



            canvasCtx.lineWidth = 1.5;

            canvasCtx.strokeStyle = '#ffffff';

            canvasCtx.beginPath();



            const sliceWidth = width / bufferLength;

            let x = 0;



            for (let i = 0; i < bufferLength; i++) {

                const v = dataArray[i] / 128.0; 

                const y = (v - 1.0) * (height * 1.5) + (height / 2);



                if (i === 0) {

                    canvasCtx.moveTo(x, y);

                } else {

                    canvasCtx.lineTo(x, y);

                }



                x += sliceWidth;

            }



            canvasCtx.stroke();

        }



        window.addEventListener('resize', resizeVisualizer);

        resizeVisualizer();



        audioEl.addEventListener('play', () => {

            try {

                setupVisualizer();



                if (audioContext.state === 'suspended') {

                    audioContext.resume();

                }

            } catch (err) {

                console.log('Visualizer setup:', err);

            }

        });



        const minFreq = 87.0;

        const maxFreq = 108.0;



        const stations = {

            87.0: { title: "Alpha", file: "audio/quaturo.mp3" },

            87.5: { title: "Beta", file: "audio/automatism.mp3" },

            88.0: { title: "Gamma", file: "audio/next flight home.mp3" },

            88.5: { title: "Delta", file: "audio/father.mp3" },

            89.0: { title: "Epsilon", file: "audio/cohesion.mp3" },

            89.5: { title: "Stigma", file: "audio/sacrifice.mp3" },

            90.0: { title: "Zeta", file: "audio/always.mp3" },

            90.5: { title: "Eta", file: "audio/monster.mp3" },

            91.0: { title: "Theta", file: "audio/caroline neron.mp3" },

            91.5: { title: "Iota", file: "audio/slow think.mp3" },

            92.0: { title: "Iota Alpha", file: "audio/inversion.mp3" },

            92.5: { title: "Iota Beta", file: "audio/ubiquity.mp3" },

            93.0: { title: "Iota Gamma", file: "audio/understanding.mp3" },

            93.5: { title: "Iota Delta", file: "audio/caprizant.mp3" },

            94.0: { title: "Iota Epsilon", file: "audio/arise.mp3" },

            94.5: { title: "Iota Stigma", file: "audio/melancoly in flat.mp3" },

            95.0: { title: "Iota Zeta", file: "audio/push.mp3" },

            95.5: { title: "Iota Eta", file: "audio/recalcitrant.mp3" },

            96.0: { title: "Iota Theta", file: "audio/across bourbon street.mp3" },

            96.5: { title: "Kappa", file: "audio/eveille.mp3" },

            97.0: { title: "Kappa Alpha", file: "audio/esprit itinerant.mp3" },

            97.5: { title: "Kappa Beta", file: "audio/the daunting.mp3" },

            98.0: { title: "Kappa Gamma", file: "audio/mass effect.mp3" },

            98.5: { title: "Kappa Delta", file: "audio/spectrum.mp3" },

            99.0: { title: "Kappa Epsilon", file: "audio/bang.mp3" },

            99.5: { title: "Kappa Stigma", file: "audio/tangerine.mp3" },

            100.0: { title: "Kappa Zeta", file: "audio/quantum touch.mp3" },

            100.5: { title: "Kappa Eta", file: "audio/bliss.mp3" },

            101.0: { title: "Kappa Theta", file: "audio/resounding.mp3" },

            101.5: { title: "Lambda", file: "audio/oticons.mp3" },

            102.0: { title: "Lambda Alpha", file: "audio/estrange.mp3" },

            102.5: { title: "Lambda Beta", file: "audio/twin sparks.mp3" },

            103.0: { title: "Lambda Gamma", file: "audio/pacis.mp3" },

            103.5: { title: "Lambda Delta", file: "audio/chase.mp3" },

            104.0: { title: "Lambda Epsilon", file: "audio/soleil.mp3" },

            104.5: { title: "Lambda Stigma", file: "audio/grave.mp3" },

            105.0: { title: "Lambda Zeta", file: "audio/stubborness.mp3" },

            105.5: { title: "Lambda Eta", file: "audio/cinderella shoe.mp3" },

            106.0: { title: "Lambda Theta", file: "audio/dynamite.mp3" },

            106.5: { title: "Mu", file: "audio/equanimity.mp3" },

            107.0: { title: "Mu Alpha", file: "audio/lucioles.mp3" },

            107.5: { title: "Mu Beta", file: "audio/dancer.mp3" },

            108.0: { title: "Mu Gamma", file: "audio/there.mp3" }

        };



        tuner.addEventListener('input', (e) => {

            const rawVal = parseFloat(e.target.value);

            const percent = ((rawVal - minFreq) / (maxFreq - minFreq)) * 100;

            tuningBar.style.left = `${percent}%`;



            const keys = Object.keys(stations).map(Number);

            let closestKey = keys.reduce((prev, curr) => Math.abs(curr - rawVal) < Math.abs(prev - rawVal) ? curr : prev);

            let minDiff = Math.abs(rawVal - closestKey);



            if (minDiff <= 0.25) {

                let station = stations[closestKey];

                stationDisplay.innerHTML = `[ LOCKED ] > TRANSMISSION: ${station.title} (${closestKey.toFixed(1)} MHz)`;

                

                try {

                    setupVisualizer();



                    if (audioContext.state === 'suspended') {

                        audioContext.resume();

                    }

                } catch (err) {

                    console.error("Visualizer initialization failed:", err);

                }



                if (!audioEl.src.endsWith(station.file)) {

                    audioEl.src = station.file;

                    audioEl.load();

                }



                audioEl.play().catch(err => {

                    console.log("Playback interaction needed:", err);

                });

            } else {

                stationDisplay.innerHTML = `STATIC... [ FREQ: ${rawVal.toFixed(1)} MHz ]`;

                audioEl.pause();

                audioEl.src = "";

            }

        });

    </script>

</body>

</html>
