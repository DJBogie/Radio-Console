<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Audio Visualizer</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            width: 400px;
        }

        canvas {
            width: 100%;
            height: 120px;
            background: #050805;
            border: 2px solid #1a261a;
            border-radius: 4px;
            margin-bottom: 20px;
            display: block;
        }

        audio {
            width: 100%;
            margin-bottom: 15px;
        }

        .instructions {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h3>Audio Visualizer</h3>
        
        <!-- Canvas for the visualizer -->
        <canvas id="visualizerCanvas" width="400" height="120"></canvas>

        <!-- Standard Audio Element with crossOrigin enabled for Web Audio API -->
        <audio id="audioEl" src="audio/quaturo.mp3" controls crossorigin="anonymous"></audio>
        
        <div class="instructions">Play audio to activate visualizer</div>
    </div>

    <script>
        const audioEl = document.getElementById('audioEl');
        const canvas = document.getElementById('visualizerCanvas');
        const canvasCtx = canvas.getContext('2d');

        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let isInitialized = false;

        function initAudioPipeline() {
            if (isInitialized) return;

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; // Smaller size for chunkier, distinct frequency bars

                sourceNode = audioCtx.createMediaElementSource(audioEl);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);

                isInitialized = true;
            } catch (e) {
                console.error("Web Audio API setup error:", e);
            }
        }

        // Ensure AudioContext starts/resumes upon play interaction
        audioEl.addEventListener('play', () => {
            initAudioPipeline();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        });

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);

            canvasCtx.fillStyle = '#050805';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            if (!analyser || audioEl.paused) {
                // Draw a flat line if paused or stopped
                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = '#4cd137';
                canvasCtx.beginPath();
                canvasCtx.moveTo(0, canvas.height / 2);
                canvasCtx.lineTo(canvas.width, canvas.height / 2);
                canvasCtx.stroke();
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const barCount = 32;
            const gap = 4;
            const barWidth = (canvas.width - (gap * (barCount - 1))) / barCount;
            
            let x = 0;
            for (let i = 0; i < barCount; i++) {
                let barHeight = (dataArray[i] / 255) * canvas.height * 0.9;

                canvasCtx.fillStyle = '#4cd137';
                canvasCtx.shadowBlur = 6;
                canvasCtx.shadowColor = '#4cd137';
                
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                x += barWidth + gap;
            }
        }

        // Start the render loop immediately
        renderVisualizer();
    </script>
</body>
</html>
