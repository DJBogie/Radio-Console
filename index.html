<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Console - Independent Broadcast</title>
    <style>
        body {
            background-color: #2b1d15;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('photo/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #e0d0c0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            user-select: none;
        }

        .console-cabinet {
            background: linear-gradient(135deg, rgba(43, 29, 21, 0.92), rgba(24, 16, 12, 0.92));
            border: 12px solid #080504;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 2px 8px rgba(255,255,255,0.05);
            width: 780px;
            text-align: center;
            backdrop-filter: blur(2px);
        }

        .brand-plate {
            font-size: 14px;
            letter-spacing: 4px;
            color: #8c7355;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .radio-faceplate {
            background: #111;
            border: 4px solid #222;
            border-radius: 8px;
            padding: 20px 25px;
            position: relative;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .knob-assembly {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
        }

        .knob {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: radial-gradient(circle, #e0e0e0 30%, #888 65%, #333 100%);
            border: 4px solid #111;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.8);
            position: relative;
            transform: rotate(-45deg);
        }

        .knob::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 20px;
            background: #222;
            border-radius: 2px;
        }

        .knob-label {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 2px;
            margin-top: 8px;
            font-weight: bold;
        }

        .dial-window {
            flex-grow: 1;
            background: #000;
            border: 3px solid #2c2c2c;
            border-radius: 4px;
            padding: 12px 15px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            text-align: left;
        }

        .scale-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #ccc;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .band-label {
            color: #ff3333;
            font-weight: bold;
            width: 35px;
        }

        .scale-numbers {
            display: flex;
            justify-content: space-between;
            flex-grow: 1;
            padding: 0 5px;
            overflow: hidden;
        }

        .scale-numbers span {
            font-size: 9px;
            white-space: nowrap;
        }

        .scale-unit {
            color: #ff3333;
            font-weight: bold;
            font-size: 11px;
            width: 35px;
            text-align: right;
        }

        .tuning-track-container {
            position: relative;
            height: 16px;
            background: #181818;
            border-radius: 3px;
            margin: 6px 35px 8px 35px;
            border: 1px solid #333;
        }

        .tuning-indicator-bar {
            position: absolute;
            top: 2px;
            bottom: 2px;
            width: 12px;
            background: #e6e6e6;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            transform: translateX(-50%);
            transition: left 0.05s ease-out;
        }

        .sub-footer-text {
            text-align: center;
            font-size: 11px;
            color: #888;
            letter-spacing: 2px;
            border-top: 1px solid #222;
            padding-top: 6px;
            margin-top: 4px;
        }

        .screen-display {
            background: rgba(8, 12, 8, 0.9);
            border: 2px solid #1a261a;
            padding: 15px;
            border-radius: 4px;
            font-size: 15px;
            color: #4cd137;
            min-height: 32px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(76, 209, 55, 0.4);
        }

        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type=range] {
            width: 100%;
            accent-color: #8c7355;
            cursor: pointer;
            height: 8px;
            background: #111;
            border-radius: 4px;
        }

        .helper-text {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* CYBERPUNK AUDIO VISUALIZER */
        .visualizer {
            height: 180px;
            margin: 0 0 20px 0;
            padding: 8px;
            background: #08080a;
            border: 2px solid #1a1a2e;
            border-radius: 4px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        #visualizerCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="console-cabinet">
        <div class="brand-plate">DJBogie Radio Console High Fidelity Receiver</div>
        
        <div class="radio-faceplate">
            <div class="knob-assembly">
                <div class="knob"></div>
                <div class="knob-label">VOLUME</div>
            </div>

            <div class="dial-window">
                <div class="scale-row">
                    <span class="band-label">FM</span>
                    <div class="scale-numbers">
                        <span>88</span><span>90</span><span>92</span><span>94</span><span>96</span><span>98</span><span>100</span><span>102</span><span>105</span><span>108</span>
                    </div>
                    <span class="scale-unit">MHz</span>
                </div>

                <div class="tuning-track-container">
                    <div id="tuningBar" class="tuning-indicator-bar" style="left: 0%;"></div>
                </div>

                <div class="scale-row">
                    <span class="band-label" style="color: #ffaa33;">AM</span>
                    <div class="scale-numbers" style="color: #aaa;">
                        <span>535</span><span>650</span><span>800</span><span>1000</span><span>1200</span><span>1400</span><span>1500</span><span>1605</span>
                    </div>
                    <span class="scale-unit" style="color: #ffaa33;">kHz</span>
                </div>

                <div class="sub-footer-text">FM/AM BAND RADIO CONSOLE</div>
            </div>

            <div class="knob-assembly">
                <div class="knob" style="transform: rotate(45deg);"></div>
                <div class="knob-label">TUNING</div>
            </div>
        </div>
        
        <div class="screen-display" id="stationDisplay">
            RECEIVER STATUS: STANDBY... SWEEP DIAL TO SCAN FREQUENCIES
        </div>

        <div class="visualizer">
            <canvas id="visualizerCanvas"></canvas>
        </div>

        <div class="controls-panel">
            <input type="range" id="tuner" min="87.0" max="108.0" step="0.1" value="87.0">
            <div class="helper-text">Frequency Slide Tuner</div>
        </div>
    </div>

    <!-- Single Audio Element -->
    <audio id="mainAudio" preload="auto" loop></audio>

    <script>
        const tuner = document.getElementById('tuner');
        const tuningBar = document.getElementById('tuningBar');
        const stationDisplay = document.getElementById('stationDisplay');
        const audioEl = document.getElementById('mainAudio');

        // ==========================================
        // CYBERPUNK AUDIO SPECTRUM ENGINE
        // ==========================================
        const canvas = document.getElementById('visualizerCanvas');
        const canvasCtx = canvas.getContext('2d');

        let audioContext = null;
        let analyser = null;
        let sourceNode = null;
        let visualizerStarted = false;

        // State variables for the complex effects
        let beatPulse = 0;
        let lastKickEnergy = 0;
        const historyBuffer = new Array(30).fill(0);
        let historyIndex = 0;
        let hudRotation = 0;
        const neonElements = [];

        function initNeonElements(width, height) {
            neonElements.length = 0;
            const symbols = ['♩', '♪', '♫', '♬', 'ℋ', '⚡', '∅', '⌬'];
            for (let i = 0; i < 35; i++) {
                neonElements.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    type: Math.random() > 0.5 ? 'symbol' : 'orb',
                    symbol: symbols[Math.floor(Math.random() * symbols.length)],
                    orbRadius: 1.5 + Math.random() * 3,
                    baseGlow: 5 + Math.random() * 10,
                    pulseSpeed: 0.02 + Math.random() * 0.03,
                    phase: Math.random() * Math.PI * 2,
                    driftX: (Math.random() - 0.5) * 0.5,
                    driftY: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function resizeVisualizer() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));

            // Scale context to handle HiDPI displays correctly
            canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (neonElements.length === 0) {
                initNeonElements(rect.width, rect.height);
            }
        }

        function setupVisualizer() {
            if (visualizerStarted) return;

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();

            // Configure analyser for spectrum data
            analyser.fftSize = 512; // Higher resolution for spectrum bars
            analyser.smoothingTimeConstant = 0.6; // Smooth transition between frames

            sourceNode = audioContext.createMediaElementSource(audioEl);
            sourceNode.connect(analyser);
            analyser.connect(audioContext.destination);

            visualizerStarted = true;
            resizeVisualizer();
            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            // Apply a strong fade trail for motion blur effect
            canvasCtx.fillStyle = 'rgba(8, 8, 10, 0.38)';
            canvasCtx.fillRect(0, 0, width, height);

            const bufferLength = analyser ? analyser.frequencyBinCount : 128;
            const dataArray = new Uint8Array(bufferLength);
            let kickEnergy = 0;
            let avgEnergy = 0;

            if (analyser && !audioEl.paused) {
                analyser.getByteFrequencyData(dataArray);

                // Calculate overall energy (average amplitude)
                let sum = 0;
                // Focus on a sub-bass/kick range (e.g., first 15% of bins)
                let kickRange = Math.floor(bufferLength * 0.15);
                for (let i = 0; i < kickRange; i++) {
                    sum += dataArray[i];
                }
                kickEnergy = sum / kickRange / 255;

                // Average energy across the full spectrum
                let fullSum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    fullSum += dataArray[i];
                }
                avgEnergy = fullSum / bufferLength / 255;
            }

            // Advanced Beat Detection Algorithm
            let historySum = historyBuffer.reduce((a, b) => a + b, 0);
            let localAverage = historySum / historyBuffer.length;
            
            historyBuffer[historyIndex] = kickEnergy;
            historyIndex = (historyIndex + 1) % historyBuffer.length;

            let transientThreshold = localAverage * 1.35; // Threshold must be significantly higher than average
            let isBeat = (kickEnergy > transientThreshold) && (kickEnergy > 0.3) && (kickEnergy > lastKickEnergy);

            if (isBeat) {
                beatPulse = 1.0; // Full beat pulse
            }
            lastKickEnergy = kickEnergy;
            beatPulse *= 0.82; // Fast decay curve
